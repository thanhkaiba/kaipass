name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed to push the gh-pages branch and to attach files to a release.
permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Build web app
        run: npm run build
        env:
          # Not a secret: an OAuth client ID is public by design. Set it under
          # Settings → Secrets and variables → Actions → Variables.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ vars.GOOGLE_API_KEY }}

      - name: Build browser extension
        run: npm run build:ext
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ vars.GOOGLE_API_KEY }}

      - name: Build Android web files
        run: npm run build:android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Test the Android app
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      # The APK must always be signed with the same key: Android only installs updates signed with
      # the key of the installed app, and Google sign-in is tied to that key's SHA-1. Without the
      # secrets (Settings → Secrets and variables → Actions) no APK is published.
      - name: Build signed APK
        id: apk
        if: ${{ env.KEYSTORE_B64 != '' }}
        working-directory: android
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kaipass-release.jks"
          KAIPASS_KEYSTORE="$RUNNER_TEMP/kaipass-release.jks" ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../kaipass.apk
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KAIPASS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      # The site goes to the gh-pages branch and the extension to a release, so nothing here
      # uses Actions artifact storage.
      - name: Publish web app to the gh-pages branch
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish extension and APK to the "builds" release
        run: |
          (cd dist-ext && zip -qr ../kaipass-extension.zip .)
          gh release delete builds --cleanup-tag --yes || true
          files=(kaipass-extension.zip)
          [ -f kaipass.apk ] && files+=(kaipass.apk)
          gh release create builds "${files[@]}" \
            --target "${GITHUB_SHA}" \
            --title "Bản build mới nhất" \
            --notes "Tự động tạo từ nhánh main. kaipass-extension.zip: extension cho Chrome/Edge (giải nén rồi nạp ở chrome://extensions, Load unpacked). kaipass.apk: app Android (nếu repo đã có khoá ký). KaiPass-*.dmg / .exe / .AppImage / .deb: app cho macOS, Windows, Linux (được thêm vào sau vài phút)."
        env:
          GH_TOKEN: ${{ github.token }}

  # The desktop app, built on each system for that system, then added to the same release.
  desktop:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the web files for the desktop app
        run: npm run build:desktop
      - name: Install Electron
        working-directory: desktop
        run: npm ci

      - name: Test the desktop app
        if: runner.os == 'Linux'
        run: |
          (cd desktop && npm run prepare-app)
          xvfb-run -a -s "-screen 0 1600x1000x24" npm run e2e:desktop

      # Unsigned builds (no Apple or Windows certificates): macOS gets an ad-hoc signature so it
      # runs on Apple silicon; both systems show a first-run warning, see the README.
      - name: Package
        working-directory: desktop
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Optional: a "Desktop app" OAuth client, so users need not pick its JSON file.
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}

      - name: Add to the "builds" release
        shell: bash
        run: |
          shopt -s nullglob
          files=(desktop/out/*.dmg desktop/out/*.exe desktop/out/*.AppImage desktop/out/*.deb)
          gh release upload builds "${files[@]}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
